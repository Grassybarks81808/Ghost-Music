<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ghost Music</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    height: 100vh; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(circle at 50% 38%, #2a0a13 0%, #120a10 45%, #08080a 100%);
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: #f4eef1; -webkit-user-select: none; user-select: none;
  }
  .wrap { display: grid; justify-items: center; gap: 18px; }
  .ghost { position: relative; filter: drop-shadow(0 0 26px rgba(255, 70, 100, .45)); animation: bob 2.4s ease-in-out infinite; }
  .ghost svg { display: block; }
  .ring { position: absolute; inset: -18px; border-radius: 50%; border: 1px solid rgba(255, 120, 140, .25); animation: pulse 2.4s ease-in-out infinite; }
  h1 { font-size: 21px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
  p { font-size: 12.5px; letter-spacing: .06em; color: #b7a8b0; }
  .dots span { display: inline-block; width: 4px; height: 4px; margin: 0 2px; border-radius: 50%; background: #ff6b7d; animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .2; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.08); opacity: .15; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ghost">
      <div class="ring"></div>
      <svg width="96" height="104" viewBox="0 0 96 104" aria-hidden="true">
        <path d="M8 52a40 40 0 0 1 80 0v44c0 2.8-3 4.4-5.4 3l-8.5-4.8c-1.6-.9-3.6-.9-5.2 0l-8.3 4.6c-1.6.9-3.6.9-5.2 0l-8.3-4.6c-1.6-.9-3.6-.9-5.2 0l-8.3 4.6c-1.6.9-3.6.9-5.2 0l-8.5-4.8C11 92.6 8 91 8 88.2Z" fill="#f5eef2"/>
        <rect x="31" y="46" width="9" height="20" rx="4.5" fill="#241a22"/>
        <rect x="56" y="46" width="9" height="20" rx="4.5" fill="#241a22"/>
      </svg>
    </div>
    <h1>Ghost Music</h1>
    <p>Waking the ghost <span class="dots"><span></span><span></span><span></span></span></p>
  </div>
</body>
</html>
