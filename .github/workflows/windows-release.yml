name: Build Ghost Music

# check-linux  : fast compile/test feedback + headless API smoke test.
# build-windows: the real Ghost-Music.exe, bundled yt-dlp and a ready-to-run zip.
#
# Compiler output is also posted as a commit comment when something fails, so
# the build can be diagnosed from anywhere (the raw job log is not always
# reachable).

on:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-linux:
    name: Check & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ALSA development files (cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-check

      - name: cargo check
        shell: bash
        run: |
          set -o pipefail
          cargo check --all-targets --message-format short 2>&1 | tee check.log

      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --message-format short 2>&1 | tee -a check.log

      - name: Install yt-dlp and ffmpeg for the smoke test
        run: |
          python3 -m pip install --upgrade --user yt-dlp || true
          sudo apt-get install -y ffmpeg || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the app self test (headless HTTP API)
        shell: bash
        run: |
          set -o pipefail
          cargo run --release --message-format short -- --selftest 2>&1 | tee -a check.log

      - name: Report build output as a commit comment
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Linux check failed"
            echo '```'
            grep -E "error(\[|:)|^[a-z].*:[0-9]+:[0-9]+: (error|warning)" check.log | head -80
            echo '```'
            echo "#### warnings"
            echo '```'
            grep -E "warning" check.log | head -25
            echo '```'
          } > report.md
          jq -Rs '{body: .}' report.md > payload.json
          curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d @payload.json \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            | jq -r '.html_url // .message'

  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      - name: Build release executable
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --message-format short 2>&1 | tee check.log

      - name: Self test the executable (headless API smoke test)
        shell: bash
        run: |
          set -o pipefail
          ./target/release/ghost-music.exe --version 2>&1 | tee -a check.log
          ./target/release/ghost-music.exe --selftest 2>&1 | tee -a check.log

      - name: Report build output as a commit comment
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Windows build failed"
            echo '```'
            grep -E "error(\[|:)|error\[" check.log | head -80
            echo '```'
            echo "#### warnings"
            echo '```'
            grep -E "warning" check.log | head -25
            echo '```'
          } > report.md
          jq -Rs '{body: .}' report.md > payload.json
          curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d @payload.json \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            | jq -r '.html_url // .message'

      - name: Stage release files
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ghost-music.exe dist/Ghost-Music.exe

          # Bundle yt-dlp so search, streaming and downloads work out of the box.
          $ytdlp = "dist/yt-dlp.exe"
          try {
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile $ytdlp -UseBasicParsing
            Write-Host "Bundled yt-dlp: $((Get-Item $ytdlp).Length) bytes"
          } catch {
            Write-Warning "Could not download yt-dlp.exe: $_"
          }

          @"
          Ghost Music $((Get-Item dist/Ghost-Music.exe).VersionInfo.FileVersion)
          ===============================================================

          HOW TO RUN
          1. Unzip this folder somewhere permanent (not inside the zip).
          2. Double-click Ghost-Music.exe.

          MEDIA TOOLS
          - yt-dlp.exe is included in this folder; Ghost Music finds it next to the
            executable automatically. Update it any time by replacing the file with
            a newer one from https://github.com/yt-dlp/yt-dlp/releases/latest
          - ffmpeg.exe is optional but recommended. It adds MP3 conversion and
            HLS-only streams. Get it from https://www.gyan.dev/ffmpeg/builds/
            (ffmpeg-release-essentials.zip) and copy ffmpeg.exe next to
            Ghost-Music.exe.

          WHAT YOU GET
          - YouTube Music style home / explore / library / queue screens
          - Playback of millions of songs straight from YouTube (no download needed)
          - MP3 or MP4 downloads into %USERPROFILE%\Downloads\Ghost Music
          - A local HTTP API + web remote: while the app runs, open
            http://127.0.0.1:PORT (the port and URL are shown in Settings)

          SHORTCUTS
          Space play/pause - Left/Right seek - Up/Down volume - N/P next/prev
          Ctrl+K focus search

          FILES
          Settings, likes and playlists: %APPDATA%\Ghost Music\library.json
          Stream cache:                  %LOCALAPPDATA%\Ghost Music\cache

          Please only download or stream content you have the rights to use.
          Ghost Music is MIT licensed and is not affiliated with YouTube.
          "@ | Set-Content -Encoding UTF8 dist/README-Windows.txt

      - name: Create zip
        if: success()
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath Ghost-Music-Windows.zip -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Music-Windows
          path: |
            dist/*
            Ghost-Music-Windows.zip

      - name: Upload the resolved Cargo.lock (pinned dependency versions)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cargo-lock
          path: Cargo.lock
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            Ghost-Music-Windows.zip

      # A manual dispatch labels the run as a release so the app can be shipped
      # without tagging (handy while iterating).
      - name: Publish GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-build
          name: Ghost Music build ${{ github.run_number }}
          body: |
            Automated Ghost Music build from `${{ github.sha }}`.
            Download **Ghost-Music-Windows.zip** below, unzip it and run Ghost-Music.exe.
            yt-dlp is bundled; ffmpeg is optional (MP3 conversion).
          files: |
            dist/*
            Ghost-Music-Windows.zip
