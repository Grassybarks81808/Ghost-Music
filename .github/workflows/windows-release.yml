name: Build Windows app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ghost-music.exe dist/Ghost-Music.exe
          @"
          Ghost Music requires yt-dlp.exe beside the app or available on PATH.
          FFmpeg is recommended and required for MP3 conversion.
          "@ | Set-Content dist/README-Windows.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Music-Windows
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
